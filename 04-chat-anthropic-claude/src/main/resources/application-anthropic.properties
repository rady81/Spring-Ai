spring.ai.anthropic.base-url=https://api.anthropic.com
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-opus-4-0
spring.ai.anthropic.chat.options.temperature=0.7
# Use Anthropic for chat (important when multiple chat providers are on classpath)
spring.ai.model.chat=anthropic

# Disable OpenAI model auto-configs you don't use
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
logging.level.org.springframework.ai.chat.client.advisor=DEBUG